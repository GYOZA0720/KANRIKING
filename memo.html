<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム同期アプリ</title>
  <!-- SupabaseのJavaScriptライブラリを読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>PC・スマホ同期メモ</h1>
  <input type="text" id="memoInput" placeholder="メモを入力">
  <button onclick="addMemo()">送信</button>
  <ul id="memoList"></ul>

  <script>
    // Supabaseの接続情報（設定済み）
    const SUPABASE_URL = 'https://vfwcaywehdlfjdawwvitm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmd2NheXdlahdlfjdawwvitmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MTE3MDQsImV4cCI6MjEwODQ4NzcwNH0.lmOLUwVLzM56RJVOB2R6P6lmbDESsod8FxM7kxPReKs';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // データを追加する処理
    async function addMemo() {
      const input = document.getElementById('memoInput');
      if (!input.value) return;
      
      const { error } = await supabase.from('todos').insert([{ content: input.value }]);
      if (error) {
        console.error('エラー:', error);
        alert('保存に失敗しました。Supabaseで "todos" テーブルが作成されているか確認してください。');
        return;
      }
      input.value = '';
    }

    // データ一覧を表示する処理
    async function loadMemos() {
      const { data, error } = await supabase.from('todos').select('*');
      if (error) {
        console.error('データ取得エラー:', error);
        return;
      }
      const list = document.getElementById('memoList');
      if (!data) return;
      list.innerHTML = data.map(item => `<li>${item.content}</li>`).join('');
    }

    // PCとスマホでリアルタイムに同期する処理
    supabase
      .channel('schema-db-changes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'todos' }, payload => {
        loadMemos();
      })
      .subscribe();

    // 最初にページを開いたときにもデータを読み込む
    loadMemos();
  </script>
</body>
</html>
